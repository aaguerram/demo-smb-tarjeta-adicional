# Balanceador delante de las réplicas de proxy-guardar-pdf, en el papel del Service/Route de
# OpenShift. Reparte por petición (round-robin) y deja pasar el PDF en streaming.
worker_processes 2;
events { worker_connections 1024; }
pid /tmp/nginx.pid;

http {
    access_log off;
    client_body_temp_path /tmp/cuerpo;
    proxy_temp_path /tmp/proxy;

    # Docker DNS: se vuelve a resolver cada 10 s para ver las réplicas nuevas.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream proxy_guardar_pdf {
        zone proxy_guardar_pdf 64k;
        server proxy-guardar-pdf:8080 resolve;
        keepalive 64;
    }

    server {
        listen 8080;
        client_max_body_size 20m;

        location / {
            proxy_pass http://proxy_guardar_pdf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Sin búfer: el PDF pasa por bloques al proxy, igual que sin balanceador.
            proxy_request_buffering off;
            proxy_buffering off;
            add_header X-Replica $upstream_addr always;
        }
    }
}
